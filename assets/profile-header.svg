<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sanskar Pandey profile header</title>
  <desc id="desc">Backend, platform, and systems engineering profile banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.46" stop-color="#0A1F2E"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="132" y1="62" x2="1045" y2="316" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.83 0 0 0 0 0.93 0 0 0 0.35 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <path d="M72 290C189 199 271 279 391 182C520 77 642 92 764 145C880 195 975 167 1125 70" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M83 89H250M83 114H189M83 139H298" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M918 238H1082M918 263H1032M918 288H1110" stroke="#34D399" stroke-width="7" stroke-linecap="round" stroke-opacity="0.55"/>

  <circle cx="176" cy="246" r="9" fill="#22D3EE"/>
  <circle cx="402" cy="180" r="9" fill="#34D399"/>
  <circle cx="760" cy="146" r="9" fill="#F59E0B"/>
  <circle cx="1018" cy="146" r="9" fill="#22D3EE"/>

  <g transform="translate(72 60)">
    <text x="0" y="0" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2">BACKEND / PLATFORM / SYSTEMS</text>
    <text x="0" y="68" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="60" font-weight="800">Sanskar Pandey</text>
    <text x="0" y="116" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23">Distributed systems, observability, storage, payments, and AI workflows.</text>
  </g>

  <g transform="translate(72 232)">
    <rect x="0" y="0" width="93" height="34" rx="17" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.55"/>
    <text x="24" y="23" fill="#E0F2FE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Go</text>
    <rect x="105" y="0" width="126" height="34" rx="17" fill="#0F172A" stroke="#34D399" stroke-opacity="0.55"/>
    <text x="129" y="23" fill="#DCFCE7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Python</text>
    <rect x="243" y="0" width="155" height="34" rx="17" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.55"/>
    <text x="267" y="23" fill="#E0F2FE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">TypeScript</text>
    <rect x="410" y="0" width="189" height="34" rx="17" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.55"/>
    <text x="434" y="23" fill="#FEF3C7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Distributed</text>
    <rect x="611" y="0" width="100" height="34" rx="17" fill="#0F172A" stroke="#A78BFA" stroke-opacity="0.55"/>
    <text x="643" y="23" fill="#F3E8FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">AI</text>
  </g>

  <g transform="translate(858 228)">
    <rect x="0" y="0" width="250" height="52" rx="18" fill="#020617" fill-opacity="0.58" stroke="#475569" stroke-opacity="0.58"/>
    <text x="23" y="33" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">architecture -> tests -> ops</text>
  </g>
</svg>
